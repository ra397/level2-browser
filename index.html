<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="icon" href="/icons/nexrad-icon.svg" type="image/x-icon"/>
    <title>NEXRAD Level II</title>
</head>
<body>
    <div id="map"></div>

    <div id="menu">
        <input type="text" id="urlInput" placeholder="Paste NEXRAD Level 2 URL" spellcheck="false">
        <button class="submit-btn" id="decodeBtn">View</button>

        <div id="sweepContainer" class="section-container" style="display: none;">
            <div class="section-header">
                <span>Sweeps</span>
            </div>
            <div id="sweepList" class="radio-grid"></div>
        </div>

        <div id="momentContainer" class="section-container" style="display: none;">
            <div class="section-header">
                <span>Moments</span>
            </div>
            <div id="momentList" class="radio-row"></div>
        </div>

        <div id="overlayControls" class="section-container" style="display: none;">
            <div class="section-header">
                <span>Overlay</span>
            </div>
            <div class="overlay-controls-row">
                <label class="opacity-label">
                    Opacity
                    <input type="range" id="opacitySlider" min="0" max="1" step="0.05" value="1">
                    <span id="opacityValue">100%</span>
                </label>
                <button class="clear-btn" id="clearOverlayBtn">Clear</button>
            </div>
        </div>
    </div>

    <div id="color-legend" class="hidden">
        <span class="legend-title"></span>
        <div class="legend-content">
            <div class="legend-bar"></div>
            <div class="legend-labels"></div>
        </div>
    </div>

    <div class="graph-wrapper">
        <div class="title-bar">
            <h2>Radar Beam Propagation</h2>
            <span class="subtitle">4/3 Earth Radius Model · 0.9° Beamwidth</span>
        </div>

        <div class="y-axis-container">
            <span class="y-axis-title">Height (km)</span>
            <div class="y-axis-labels" id="yLabels"></div>
            <div class="graph-container" id="graphContainer">
                <svg id="beamSvg" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none"></svg>
                <div class="tooltip" id="tooltip"></div>
            </div>
        </div>

        <div class="x-axis-labels" id="xLabels"></div>
        <div class="x-axis-title">Ground Range (km)</div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
